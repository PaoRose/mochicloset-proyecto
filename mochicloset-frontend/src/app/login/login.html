<div class="login-container">

  <a routerLink="/home">
    <img class="login-logo" src="logo.png" alt="Mochi Closet Logo">
  </a>

  <div class="login-wrapper">

    <h1 class="title">Bienvenida de vuelta</h1>
    <p class="subtitle">Inicia sesión para continuar</p>

    <form class="login-form">

      <div class="input-group">
        <label for="email">Email</label>
        <div class="input-field">
          <span class="input-icon">✉</span>
          <input id="email" type="email" placeholder="tu@email.com" autocomplete="email" [(ngModel)]="usuario.email" name="email" />
        </div>
      </div>

      <div class="input-group">
        <label for="password">Contraseña</label>
        <div class="input-field">
          <span class="input-icon">🔒</span>
          <input id="password" type="password" placeholder="••••••••" autocomplete="current-password" [(ngModel)]="usuario.password" name="password" />
        </div>
      </div>

      <button class="login-btn" type="button" (click)="iniciarSesion()">Iniciar sesión</button>

    </form>

    <p class="register">
      ¿No tienes cuenta? <a routerLink="/registro">Regístrate</a>
    </p>

  </div>

</div>
