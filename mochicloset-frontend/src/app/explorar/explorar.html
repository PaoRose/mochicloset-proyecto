<div class="explorar-container">

  <!-- Buscador y filtros -->
  <div class="explorar-toolbar">
    <div class="explorar-search">
      <span class="search-icon">🔍</span>
      <input type="text" placeholder="Buscar ropa, accesorios..." />
    </div>
    <div class="explorar-toolbar-right">
      <select class="explorar-orden">
        <option>Más recientes</option>
        <option>Menor precio</option>
        <option>Mayor precio</option>
      </select>
      <button class="explorar-filtros-btn" (click)="abrirFiltros()">⚙ Filtros</button>
    </div>
  </div>

  <!-- Categorías -->
  <div class="explorar-categorias">
    <button class="categoria-btn active">Todas</button>
    <button class="categoria-btn">Vestidos</button>
    <button class="categoria-btn">Blusas</button>
    <button class="categoria-btn">Pantalones</button>
    <button class="categoria-btn">Faldas</button>
    <button class="categoria-btn">Accesorios</button>
  </div>

  <!-- Grid de prendas -->
  <div class="explorar-grid">

    <div class="prenda-card" *ngFor="let p of publicaciones" [routerLink]="['/prenda', p.id]">
      <div class="prenda-img-wrapper">
        <img [src]="p.imagenUrl" [alt]="p.titulo">
        <button class="prenda-fav">🤍</button>
      </div>
      <div class="prenda-info">
        <p class="prenda-nombre">{{ p.titulo }}</p>
        <div class="prenda-footer">
          <span class="prenda-precio">Bs. {{ p.precio }}</span>
          <span class="prenda-tag">{{ p.talla }}</span>
          <span class="prenda-tag">{{ p.condicion }}</span>
        </div>
      </div>
    </div>
  </div>
</div>


<!-- Drawer filtros — FUERA del contenedor -->
<div class="filtros-overlay" *ngIf="filtrosAbiertos" (click)="cerrarFiltros()">
  <div class="filtros-drawer" (click)="$event.stopPropagation()">

    <div class="filtros-header">
      <div>
        <h3 class="filtros-title">Filtros</h3>
        <p class="filtros-subtitle">Refina tu búsqueda</p>
      </div>
      <button class="filtros-close" (click)="cerrarFiltros()">✕</button>
    </div>

    <div class="filtros-group">
      <label>Categoría</label>
      <select>
        <option>Todas las categorías</option>
        <option>Vestidos</option>
        <option>Blusas</option>
        <option>Pantalones</option>
        <option>Faldas</option>
        <option>Accesorios</option>
      </select>
    </div>

    <div class="filtros-group">
      <label>Talla</label>
      <select>
        <option>Todas las tallas</option>
        <option>XS</option>
        <option>S</option>
        <option>M</option>
        <option>L</option>
        <option>XL</option>
      </select>
    </div>

    <div class="filtros-group">
      <label>Condición</label>
      <select>
        <option>Todas las condiciones</option>
        <option>Nuevo</option>
        <option>Como nuevo</option>
        <option>Buen estado</option>
        <option>Usado</option>
      </select>
    </div>

    <div class="filtros-group">
      <div class="filtros-precio-header">
        <label>Rango de precio</label>
        <span class="filtros-precio-valor">Bs. 0 - Bs. 500</span>
      </div>
      <input type="range" min="0" max="500" value="500" class="filtros-range" />
    </div>

    <button class="filtros-limpiar">Limpiar filtros</button>

  </div>
</div>
