<div class="chat-container">

  <!-- Header -->
  <div class="chat-header">
    <a class="chat-volver" routerLink="/explorar">←</a>
    <img class="chat-avatar" src="assets/foto-perfil.jpg" alt="Vendedora">
    <div class="chat-header-info">
      <p class="chat-nombre">Chat</p>
    </div>
  </div>

  <!-- Mensajes -->
  <div class="chat-mensajes">

    <div *ngFor="let m of mensajes"
         [class]="m.remitenteId === usuarioId ? 'mensaje mensaje-enviado' : 'mensaje mensaje-recibido'">
      <p>{{ m.texto }}</p>
      <span class="mensaje-hora">{{ m.fechaEnvio | date:'shortTime' }}</span>
    </div>

  </div>

  <!-- Input -->
  <div class="chat-input-wrapper">
    <div class="chat-input">
      <button class="chat-adjuntar">🖼</button>
      <input type="text" placeholder="Escribe un mensaje..." [(ngModel)]="nuevoMensaje" name="mensaje" />
      <button class="chat-enviar" (click)="enviarMensaje()">➤</button>
    </div>
  </div>

</div>
