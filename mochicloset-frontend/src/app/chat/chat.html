<div class="chat-container">

  <!-- Header -->
  <div class="chat-header">
    <a class="chat-volver" routerLink="/perfil">←</a>
    <img class="chat-avatar" [src]="otraPersona?.fotoPerfil || 'https://img.magnific.com/vector-premium/icono-perfil-avatar-predeterminado-imagen-usuario-redes-sociales-icono-avatar-gris-silueta-perfil-blanco-ilustracion-vectorial_561158-3383.jpg?semt=ais_hybrid&w=740&q=80'" alt="usuario">
    <div class="chat-header-info">
      <p class="chat-nombre">{{ otraPersona?.nombre || 'Chat' }}</p>
      <p class="chat-username">&#64;{{ otraPersona?.username }}</p>
    </div>
    <button class="reporte-btn" (click)="abrirReporte()">⚠️ Reportar</button>
  </div>

  <!-- Prenda info -->
  <div class="chat-detalle-compra" *ngIf="conversacion">
    <div class="chat-prenda-preview">
      <img [src]="conversacion.publicacion?.imagenUrl" alt="prenda">
      <div>
        <p class="chat-prenda-nombre">{{ conversacion.publicacion?.titulo }}</p>
        <p class="chat-prenda-precio">Bs. {{ conversacion.publicacion?.precio }}</p>
      </div>
    </div>
    <button class="chat-ver-prenda" (click)="irAPrenda()" *ngIf="esCompradora && !ventaConfirmada">🔍 Ver prenda</button>
    <button class="chat-confirmar-venta" (click)="confirmarVenta()" *ngIf="!esCompradora && !ventaConfirmada">✅ Confirmar venta</button>
  </div>

  <!-- Mensajes -->
  <div class="chat-mensajes">
    <div *ngFor="let m of mensajes"
         [class]="m.remitenteId === usuarioId ? 'mensaje mensaje-enviado' : 'mensaje mensaje-recibido'">
      <ng-container *ngIf="esImagen(m.texto); else textoNormal">
        <img [src]="m.texto" class="mensaje-imagen">
      </ng-container>
      <ng-template #textoNormal>
        <p>{{ m.texto }}</p>
      </ng-template>
      <span class="mensaje-hora">{{ m.fechaEnvio | date:'h:mm a' }}</span>
    </div>
  </div>

  <div class="chat-input-wrapper">

    <!-- Popup URL imagen -->
    <div class="url-popup" *ngIf="mostrarInputUrl">
      <input type="text" placeholder="Pega la URL de la imagen..." [(ngModel)]="urlImagen" name="urlImagen" />
      <button (click)="enviarImagen()">Enviar</button>
    </div>

    <div class="chat-input">
      <button class="chat-adjuntar" (click)="abrirInputUrl()" title="Enviar imagen">🖼</button>
      <input type="text" placeholder="Escribe un mensaje..." [(ngModel)]="nuevoMensaje" name="nuevoMensaje" (keyup.enter)="enviarMensaje()" />
      <button class="chat-enviar" (click)="enviarMensaje()">➤</button>
    </div>

  </div>

  <!-- Confirmación de venta -->
  <div class="chat-venta-confirmada" *ngIf="ventaConfirmada">
    <div class="venta-bubble">
      <span *ngIf="!esCompradora">✅ Venta confirmada</span>
      <span *ngIf="esCompradora">✅ La vendedora confirmó la venta</span>
      <button class="editar-btn" *ngIf="esCompradora && compraId" [routerLink]="['/recibo', compraId]">🧾 Ver recibo</button>
    </div>
  </div>

  <!-- Modal Reporte -->
  <div class="modal-overlay" *ngIf="modalReporte" (click)="cerrarReporte()">
    <div class="modal-seguridad" (click)="$event.stopPropagation()" style="max-width: 400px;">
      <div class="modal-seg-header">
        <div class="modal-seg-titulo-row">
          <span class="modal-seg-icono">⚠️</span>
          <h3 class="modal-seg-titulo">Reportar usuaria</h3>
        </div>
        <button class="modal-seg-close" (click)="cerrarReporte()">✕</button>
      </div>
      <div class="modal-group" style="padding: 16px;">
        <label style="font-weight: 600; margin-bottom: 8px; display: block;">Razón del reporte</label>
        <textarea placeholder="Describe el problema..." [(ngModel)]="razonReporte" name="razonReporte"
                  style="width: 100%; border-radius: 8px; padding: 10px; border: 1px solid #ddd; min-height: 100px;"></textarea>
      </div>
      <div class="modal-seg-acciones">
        <button class="modal-seg-cancelar" (click)="cerrarReporte()">Cancelar</button>
        <button class="modal-seg-chat" (click)="enviarReporte()">Enviar reporte</button>
      </div>
    </div>
  </div>
</div>
