<div class="login-container">

  <a routerLink="/home">
    <img class="login-logo" src="logo.png" alt="Mochi Closet Logo">
  </a>

  <div class="login-wrapper">

    <h1 class="title">Crea tu cuenta</h1>
    <p class="subtitle">Únete a nuestra comunidad</p>

    <form class="login-form">

      <div class="input-group">
        <label for="nombre">Nombre Completo</label>
        <div class="input-field">
          <span class="input-icon">👤</span>
          <input id="nombre" type="text" placeholder="María López" autocomplete="name" />
        </div>
      </div>

      <div class="input-group">
        <label for="nombreusuario">Nombre de usuario</label>
        <div class="input-field">
          <span class="input-icon">&#64;</span>
          <input id="nombreusuario" type="text" placeholder="maria_closet" autocomplete="username" />
        </div>
      </div>

      <div class="input-group">
        <label for="telefono">Teléfono</label>
        <div class="input-field">
          <span class="input-icon">☏</span>
          <input id="telefono" type="tel" placeholder="+591 79886101" autocomplete="tel" />
        </div>
      </div>

      <div class="input-group">
        <label for="email">Email</label>
        <div class="input-field">
          <span class="input-icon">✉</span>
          <input id="email" type="email" placeholder="tu@email.com" autocomplete="email" />
        </div>
      </div>

      <div class="input-group">
        <label for="password">Contraseña</label>
        <div class="input-field">
          <span class="input-icon">🔒</span>
          <input id="password" type="password" placeholder="••••••••" autocomplete="current-password" />
        </div>
      </div>

      <div class="input-group">
        <label for="confirmar-password">Confirmar contraseña</label>
        <div class="input-field">
          <span class="input-icon">🔒</span>
          <input id="confirmar-password" type="password" placeholder="••••••••" autocomplete="new-password" />
        </div>
      </div>

      <button class="login-btn" type="button">Crear cuenta</button>

    </form>

    <p class="register">
      ¿Ya tienes cuenta? <a routerLink="/login">Inicia Sesión</a>
    </p>

  </div>

</div>
