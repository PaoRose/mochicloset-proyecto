<div class="editar-container">

  <!-- Volver -->
  <a class="editar-volver" routerLink="/perfil">← Volver al dashboard</a>

  <!-- Header -->
  <h1 class="editar-title">Editar perfil</h1>
  <p class="editar-subtitle">Actualiza tu información</p>

  <!-- Card -->
  <div class="editar-card">

    <!-- Foto -->
    <div class="editar-foto-section">
      <img class="editar-foto" src="assets/foto-perfil.jpg" alt="Foto de perfil">
      <button class="editar-foto-btn">📷 Cambiar foto</button>
      <p class="editar-foto-hint">Recomendamos una imagen cuadrada de al menos 400x400 px</p>
    </div>

    <hr class="editar-divider">

    <!-- Formulario -->
    <div class="editar-form">

      <div class="editar-group">
        <label for="username">Nombre de usuario</label>
        <div class="editar-input-field">
          <span class="editar-icon">&#64;</span>
          <input id="username" type="text" value="maria_closet" />
        </div>
        <span class="editar-hint">Tu usuario aparecerá como &#64;maria_closet</span>
      </div>

      <div class="editar-group">
        <label for="nombre">Nombre completo</label>
        <div class="editar-input-field">
          <span class="editar-icon">👤</span>
          <input id="nombre" type="text" value="María López" />
        </div>
      </div>

      <div class="editar-group">
        <label for="email">Email</label>
        <div class="editar-input-field editar-disabled">
          <span class="editar-icon">✉</span>
          <input id="email" type="email" value="maria.lopez@email.com" disabled />
        </div>
        <span class="editar-hint">El email no se puede modificar</span>
      </div>

      <div class="editar-group">
        <label for="telefono">Teléfono</label>
        <div class="editar-input-field">
          <span class="editar-icon">📞</span>
          <input id="telefono" type="tel" value="+591 70123456" />
        </div>
      </div>

      <!-- Botones -->
      <div class="editar-acciones">
        <button class="btn-guardar" routerLink="/perfil">Guardar cambios</button>
        <button class="btn-cancelar" routerLink="/perfil">Cancelar</button>
      </div>

    </div>

  </div>

</div>
