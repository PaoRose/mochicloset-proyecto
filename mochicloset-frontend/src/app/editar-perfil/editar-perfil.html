<div class="editar-container">

  <!-- Volver -->
  <a class="editar-volver" routerLink="/perfil">← Volver al dashboard</a>

  <!-- Header -->
  <h1 class="editar-title">Editar perfil</h1>
  <p class="editar-subtitle">Actualiza tu información</p>

  <!-- Card -->
  <div class="editar-card">

    <!-- Foto -->
    <div class="editar-foto-section">
      <img class="editar-foto" [src]="usuario?.fotoPerfil || 'assets/foto-perfil.jpg'" alt="Foto de perfil">
      <div class="editar-group">
        <label>URL de foto de perfil</label>
        <div class="editar-input-field">
          <span class="editar-icon">🖼</span>
          <input type="text" placeholder="https://..." [(ngModel)]="usuario.fotoPerfil" name="fotoPerfil" />
        </div>
      </div>
    </div>

    <hr class="editar-divider">

    <!-- Formulario -->
    <div class="editar-form">

      <div class="editar-group">
        <label for="username">Nombre de usuario</label>
        <div class="editar-input-field">
          <span class="editar-icon">&#64;</span>
          <input id="username" type="text" [(ngModel)]="usuario.username" name="username" />
        </div>
      </div>

      <div class="editar-group">
        <label for="nombre">Nombre completo</label>
        <div class="editar-input-field">
          <span class="editar-icon">👤</span>
          <input id="nombre" type="text" [(ngModel)]="usuario.nombre" name="nombre" />
        </div>
      </div>

      <div class="editar-group">
        <label for="email">Email</label>
        <div class="editar-input-field editar-disabled">
          <span class="editar-icon">✉</span>
          <input id="email" type="email" [value]="usuario?.email" disabled />
        </div>
        <span class="editar-hint">El email no se puede modificar</span>
      </div>

      <div class="editar-group">
        <label for="telefono">Teléfono</label>
        <div class="editar-input-field">
          <span class="editar-icon">📞</span>
          <input id="telefono" type="tel" [(ngModel)]="usuario.telefono" name="telefono" />
        </div>
      </div>

      <!-- Botones -->
      <div class="editar-acciones">
        <button class="btn-guardar" (click)="guardarCambios()">Guardar cambios</button>
        <button class="btn-cancelar" routerLink="/perfil">Cancelar</button>
      </div>

    </div>

  </div>

</div>
